source=~/.config/hypr/animations.conf
source=~/.config/hypr/binds.conf
source=~/.config/hypr/colors.conf
source=~/.config/hypr/decoration.conf
source=~/.config/hypr/env.conf
source=~/.config/hypr/exec.conf
source=~/.config/hypr/input.conf
source=~/.config/hypr/monitors.conf

general {
  gaps_in = 2
  gaps_out = 4

  border_size = 2

  col.active_border = $activeBorderColor1 $activeBorderColor2 40deg
  col.inactive_border = $inactiveBorderColor


  # resizing windows by clicking and dragging on borders and gaps
  resize_on_border = false

  allow_tearing = false

  layout = dwindle
}

master {
  new_status = master
}

misc {
  force_default_wallpaper = 1 # Set to 0 or 1 to disable the anime mascot wallpapers
  disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background.
}

# example windowrule
#windowrule = float,class:^(kitty)$,title:^(kitty)$

# ignore maximize requests from apps
windowrule = suppressevent maximize, class:.*

# fix some dragging issues with xwayland
windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0


windowrule = workspace 12 silent, class:discord
windowrule = workspace 12 silent, class:equibop

windowrule = workspace 11 silent, class:librewolf

windowrule = workspace 6 silent, class:lutris
windowrule = workspace 6 silent, class:prismlauncher
windowrule = workspace 6 silent, class:steam
