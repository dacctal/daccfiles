source=~/.config/hypr/animations.conf
source=~/.config/hypr/colors.conf
source=~/.config/hypr/decoration.conf
source=~/.config/hypr/env.conf
source=~/.config/hypr/exec.conf
source=~/.config/hypr/input.conf
source=~/.config/hypr/monitors.conf

$terminal = gtk-launch foot
$menu = foot --app-id otter-launcher -T foot otter-launcher
#$menu = fuzzel
#$menu = ~/.config/hypr/scripts/otter-launcher-foot
windowrule = float, class:^(otter-launcher)$
$scsh = grim -g "$(slurp)" - | wl-copy
$fullscsh = grim - | wl-copy

general {
  gaps_in = 2
  gaps_out = 4

  border_size = 2

  col.active_border = $activeBorderColor1 $activeBorderColor2 40deg
  col.inactive_border = $inactiveBorderColor


  # resizing windows by clicking and dragging on borders and gaps
  resize_on_border = false

  allow_tearing = false

  layout = dwindle
}

master {
  new_status = master
}

misc {
  force_default_wallpaper = 1 # Set to 0 or 1 to disable the anime mascot wallpapers
  disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background.
}

$mainMod = SUPER # Sets "Windows" key as main modifier

bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod SHIFT, E, exit,
bind = $mainMod, F, exec, $fileManager
bind = $mainMod, SPACE, togglefloating,
bind = $mainMod, P, exec, $menu
bind = $mainMod, R, exec, hyprctl reload
bind = $mainMod, D, exec, gtk-launch discord

bind = , Print, exec, $scsh
bind = SHIFT, Print, exec, $fullscsh

bind = $mainMod, B, exec, killall -SIGUSR1 waybar # Toggle waybar

bind = $mainMod, S, exec, ~/.config/hypr/scripts/toggle_scratch.sh
bind = $mainMod SHIFT, S, exec, ~/.config/hypr/scripts/send_to_local_scratch.sh

# move focus
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Move focus with mainMod + VIM keys
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d

# switch workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod, n, workspace, 11
bind = $mainMod, m, workspace, 12

# move active window to a workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
bind = $mainMod SHIFT, n, movetoworkspace, 11
bind = $mainMod SHIFT, m, movetoworkspace, 12

# example special workspace (scratchpad)
#bind = $mainMod, S, togglespecialworkspace, magic
#bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# scroll through existing workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# move/resize windows with
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# laptop multimedia keys
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-

# requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# example windowrule
#windowrule = float,class:^(kitty)$,title:^(kitty)$

# ignore maximize requests from apps
windowrule = suppressevent maximize, class:.*

# fix some dragging issues with xwayland
windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0


windowrule = workspace 12 silent, class:discord
windowrule = workspace 12 silent, class:equibop

windowrule = workspace 11 silent, class:librewolf

windowrule = workspace 6 silent, class:lutris
windowrule = workspace 6 silent, class:prismlauncher
windowrule = workspace 6 silent, class:steam
